name: Temporary official JCyL pharmacy data fetch

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official dataset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          urls=(
            "https://datosabiertos.jcyl.es/web/jcyl/risp/es/salud/farmacias/1284836078933.csv"
            "https://analisis.datosabiertos.jcyl.es/api/explore/v2.1/catalog/datasets/registro-de-establecimientos-farmaceuticos-de-castilla-y-leon/exports/csv?lang=es&timezone=Europe%2FMadrid&use_labels=true&delimiter=%3B"
            "https://data.opendatasoft.com/api/explore/v2.1/catalog/datasets/registro-de-establecimientos-farmaceuticos-de-castilla-y-leon@jcyl/exports/csv?lang=es&timezone=Europe%2FMadrid&use_labels=true&delimiter=%3B"
          )
          ok=0
          for url in "${urls[@]}"; do
            if curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 \
              -H 'User-Agent: Mozilla/5.0 data-research/1.0' "$url" -o artifact/farmacias_jcyl_oficial.csv; then
              if [ -s artifact/farmacias_jcyl_oficial.csv ] && grep -Eqi 'NUM_REG|num_reg' artifact/farmacias_jcyl_oficial.csv; then
                ok=1
                printf '%s\n' "$url" > artifact/source_url.txt
                break
              fi
            fi
          done
          test "$ok" -eq 1
          wc -l artifact/farmacias_jcyl_oficial.csv
      - name: Upload official registry
        uses: actions/upload-artifact@v4
        with:
          name: farmacias-jcyl-oficial
          path: artifact/
          if-no-files-found: error
          retention-days: 1
